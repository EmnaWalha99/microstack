apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: microstack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: emnawalha99/microstack-api-gateway:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: microstack-config