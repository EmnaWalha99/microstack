apiVersion: v1
kind: ConfigMap
metadata:
  name: microstack-config
  namespace: microstack
data:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  JWT_SECRET: "supersecretkey_change_in_production"
  JWT_REFRESH_SECRET: "refresh_supersecretkey_change_in_production"
  AUTH_SERVICE_URL: "http://auth-service:3002"
  JOB_QUEUE_SERVICE_URL: "http://job-queue-service:3003"
  FILE_UPLOAD_SERVICE_URL: "http://file-upload-service:3004"
  UPLOAD_DIR: "/app/uploads"
  MAX_FILE_SIZE_MB: "10"