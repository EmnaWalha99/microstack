apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: microstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: emnawalha99/microstack-auth-service:latest
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: microstack-config