version: '3.9'

networks:
  microstack-net:
    driver: bridge

volumes: 
  redis-data:
  uploads-data:

services:
  #redis 
  redis:
    image: redis:7-alpine
    container_name: MS-redis
    restart: unless-stopped
    networks:
      - microstack-net
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  #load balancer public entry point
  load-balancer:
    build: ./services/load-balancer
    container_name: MS-load-balancer
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      LB-ALOGORITHM: round-robin
      UPSTREAM_1: http://api-gateway-1:3001
      UPSTREAM_2: http://api-gateway-2:3001
    depends_on:
      - api-gateway-1
      - api-gateway-2
    networks:
      - microstack-net
  
  #api-gateway ( 2 replicas,internal)
  api-gateway-1:
    build: 
      context: ./services/api-gateway
    container_name: MS-api-gateway-1
    restart: unless-stopped
    environment:
      PORT: 3001
      INSTANCE_ID: gw-1
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMIT_WINDOWS_MS: 60000
      RATE_LIMIT_MAX: 100
      JWT_SECRET:
      AUTH_SERVICE_URL: http://auth-service:3002 
      JOB_QUEUE_SERVICE_URL: http://job-queue-service:3003
      FILE_UPLOAD_SERVICE_URL: http://file-upload-service:3004
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - microstack-net
  

  api-gateway-2:
    build: 
      context: ./services/api-gateway
    container_name: MS-api-gateway-2
    restart: unless-stopped
    environment:
      PORT: 3001
      INSTANCE_ID: gw-2
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMIT_WINDOWS_MS: 60000
      RATE_LIMIT_MAX: 100
      JWT_SECRET:
      AUTH_SERVICE_URL: http://auth-service:3002 
      JOB_QUEUE_SERVICE_URL: http://job-queue-service:3003
      FILE_UPLOAD_SERVICE_URL: http://file-upload-service:3004
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - microstack-net
  
  auth-service:
    build:
      context: ./services/auth-service
    container_name: MS-auth-service
    restart: unless-stopped
    environment:
      PORT: 3002
      JWT_SECRET: ${JWT_SECRET:-supersecretkey_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-refresh_supersecretkey_change_in_production}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
    networks:
      - microstack-net
  

  job-queue-service:
    build:
      context: ./services/job-queue-service
    container_name: MS-job-queue
    restart: unless-stopped
    environment:
      PORT: 3003
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - microstack-net
  
  file-upload-service:
    build:
      context: ./services/file-upload-service
    container_name: MS-file-upload-service
    restart: unless-stopped
    environment:
      PORT: 3004
      MAX_FILE_SIZE_MB: 10
      UPLOAD_DIR: /app/uploads
    volumes:
    - uploads-data:/app/uploads
    networks:
      - microstack-net

  


      
